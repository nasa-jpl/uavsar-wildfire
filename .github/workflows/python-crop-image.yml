    #   with:
    #     python-version: "3.9.21"
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: 3.11
        environment-file: environment.yml
        auto-update-conda: true
        activate-environment: classification
